<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      .title-container {
        background-color: #0d3b66; /* 타이타닉 느낌 짙은 바다색 */
        color: white;
        padding: 2rem;
        border-radius: 1rem;
        text-align: center;
        margin-top: 2rem;
        margin-bottom: 2rem;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }
      .title-container h1 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0;
      }

      .form-section {
        padding: 2rem;
        border-radius: 1rem;
        background-color: #f8f9fa;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .progress {
        height: 20px;
        margin-top: 20px;
      }
    </style>
    <title>타이타닉 생존 예측 테스트</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1 class="title-container">타이타닉 생존 예측 테스트</h1>
      <div class="mt-4 text-center">
        <p class="fs-6-center">
          <strong>1912년, 만약 당신이 타이타닉에 탑승하고 있었다면?</strong>
        </p>
        <p style="font-size: 0.6rem; color: #adb5bd">
          본 분석은 logisticRegression으로 분석 되었으며 재미로 봐주시면
          감사하겠습니다
        </p>
      </div>
      <div class="container mt-5">
        <form
          id="form"
          class="p-4 border rounded bg-light"
          onsubmit="return false;"
        >
          <!-- 기존 input들 그대로 유지 -->
          <!-- 반드시 name 속성을 추가해야 Spring @RequestParam으로 받음 -->

          <div class="mb-3">
            <label for="name">이름</label>
            <input
              type="text"
              id="name"
              name="name"
              class="form-control"
              required
            />
          </div>

          <div class="mb-3">
            <label for="Pclass">좌석 등급</label>
            <input
              type="number"
              id="Pclass"
              name="Pclass"
              class="form-control"
              required
            />
          </div>

          <div class="mb-3">
            <label for="Sex">성별</label>
            <select id="Sex" name="Sex" class="form-select" required>
              <option value="">선택하세요</option>
              <option value="0">남자</option>
              <option value="1">여자</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="Age">나이</label>
            <input
              type="number"
              id="Age"
              name="Age"
              class="form-control"
              required
            />
          </div>

          <div class="mb-3">
            <label for="SSA">형제자매 수</label>
            <input
              type="number"
              id="SSA"
              name="SSA"
              class="form-control"
              required
            />
          </div>

          <div class="mb-3">
            <label for="PCA">부모와 자녀 수</label>
            <input
              type="number"
              id="PCA"
              name="PCA"
              class="form-control"
              required
            />
          </div>

          <div class="mb-3">
            <label for="Fare">요금</label>
            <input
              type="number"
              id="Fare"
              name="Fare"
              class="form-control"
              step="0.01"
              required
            />
          </div>

          <div class="text-center mt-4">
            <button type="button" class="btn btn-primary" id="send">
              분석 결과 보기
            </button>
          </div>

          <!-- 프로그래스바 -->
          <div class="progress d-none" id="progressBarContainer">
            <div
              class="progress-bar progress-bar-striped progress-bar-animated"
              style="width: 0%"
              id="progressBar"
            ></div>
          </div>
        </form>
        <div class="mt-4 text-center">
          <p id="response_name"></p>
          <p id="response_pro"><strong></strong></p>
          <p id="response_predict"><strong></strong></p>
        </div>
      </div>
    </div>

    <script>
      $("#send").click(function (event) {
        event.preventDefault(); // form태그 제줄 방지 코드
        const progressBar = document.getElementById("progressBar");
        const container = document.getElementById("progressBarContainer");
        container.classList.remove("d-none");
        progressBar.style.width = "0%";

        let progress = 0;
        const formData = {
          pclass: $("#Pclass").val(),
          sex: $("#Sex").val(),
          age: $("#Age").val(),
          ssa: $("#SSA").val(),
          pca: $("#PCA").val(),
          fare: $("#Fare").val(),
        };

        $.ajax({
          url: "/analyze",
          method: "POST",
          contentType: "application/json",
          data: JSON.stringify(formData),
          success: function (response) {
            console.log(response);
            const interval = setInterval(() => {
              progress += 10;
              progressBar.style.width = `${progress}%`;

              if (progress >= 100) {
                clearInterval(interval);
                const name = document.getElementById("name").value;
                const predict = response.predict;
                const probability = response.pro;

                setTimeout(() => {
                  container.classList.add("d-none");
                  $("#response_name").text(
                    $("#name").val() + "님의 생존 예측 결과",
                  );
                  $("#response_pro").text(response.pro + "% 확률로");
                  $("#response_predict").text(response.predict);
                }, 300);
              }
            }, 100);
          },
          error: function () {},
        });
      });
    </script>
  </body>
</html>
